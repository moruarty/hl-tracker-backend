app = "hl-tracker-backend"
primary_region = "lhr" # or your preferred region

[build]
# Using Dockerfile in repo; nothing else needed here.

[[services]]
internal_port = 8080
protocol = "tcp"

  [services.concurrency]
  type = "requests"
  soft_limit = 25
  hard_limit = 50

  [[services.ports]]
  port = 80
  handlers = ["http"]

  [[services.ports]]
  port = 443
  handlers = ["tls", "http"]

  # Quick TCP liveness while app boots
  [[services.tcp_checks]]
  interval = "15s"
  timeout  = "2s"
  grace_period = "20s"

  # HTTP readiness on your route
  [[services.http_checks]]
  interval = "15s"
  timeout  = "2s"
  grace_period = "20s"
  method = "GET"
  path = "/healthz"
  protocol = "http"
