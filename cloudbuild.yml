steps:
# 1. Build the container image
- name: 'gcr.io/cloud-builders/docker'
  id: 'Build'
  args: ['build', '-t', 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/hl-tracker-backend:$COMMIT_SHA', '.']

# 2. Run the container in the background to test it
- name: 'gcr.io/cloud-builders/docker'
  id: 'Test Run'
  args:
    - 'run'
    - '-d'
    - '--name'
    - 'test-container'
    - '-e'
    - 'PORT=8080'
    - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/hl-tracker-backend:$COMMIT_SHA'

# 3. Wait a few seconds and then print its logs
- name: 'gcr.io/cloud-builders/docker'
  id: 'Check Logs'
  entrypoint: 'sh'
  args:
  - '-c'
  - |
      sleep 10
      echo "--- 🔎 Container Logs Start 🔎 ---"
      docker logs test-container
      echo "--- ⏹️ Container Logs End ⏹️ ---"

# (Deployment step remains commented out)

options:
  logging: CLOUD_LOGGING_ONLY