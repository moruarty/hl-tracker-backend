steps:
# 1. Build the container image (same as before)
- name: 'gcr.io/cloud-builders/docker'
  id: 'Build'
  args: ['build', '-t', 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/hl-tracker-backend:$COMMIT_SHA', '.']

# 2. NEW: Run the container in the background to test it
- name: 'gcr.io/cloud-builders/docker'
  id: 'Test Run'
  args:
    - 'run'
    - '-d' # Detached mode (run in background)
    - '--name'
    - 'test-container'
    - '-e'
    - 'PORT=8080' # Mimic the Cloud Run environment
    - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/hl-tracker-backend:$COMMIT_SHA'

# 3. NEW: Wait for the app to start (or crash) and then print its logs
- name: 'gcr.io/cloud-builders/docker'
  id: 'Check Logs'
  entrypoint: 'sh'
  args:
  - '-c'
  - |
      sleep 10
      echo "--- 🔎 Container Logs Start 🔎 ---"
      docker logs test-container
      echo "--- ⏹️ Container Logs End ⏹️ ---"

# 4. Deploy to Cloud Run (COMMENTED OUT FOR NOW)
# Once the 'Check Logs' step shows the server starting successfully,
# you can delete the test steps (2 and 3) and uncomment this deployment step.
# - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
#   entrypoint: gcloud
#   args:
#     - 'run'
#     - 'deploy'
#     - 'hl-tracker-backend'
#     - '--image=europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/hl-tracker-backend:$COMMIT_SHA'
#     - '--region=europe-west1'
#     - '--allow-unauthenticated'

# Keep your existing options block
options:
  logging: CLOUD_LOGGING_ONLY